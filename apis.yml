name: ShopShops
description: >-
  ShopShops is a livestream commerce marketplace for authenticated pre-owned
  luxury and designer goods — handbags, jewelry, watches, accessories, and shoes
  sold through live shopping events and an online store. Buyers shop curated
  secondhand inventory with authentication (via Entrupy), buy-now-pay-later
  (Afterpay / Shop Pay), and return assurance (Seel). The storefront runs on
  Shopify and publishes a live agent-commerce surface: a Universal Commerce
  Protocol (UCP) merchant profile, an MCP endpoint for agent-driven catalog
  search and buyer-approved checkout, an OIDC/OAuth2 Customer Account API, and an
  llms.txt describing how AI shopping agents may transact with the store.
